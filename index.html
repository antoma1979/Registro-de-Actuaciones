<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Actuaciones</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#121826;
    color:white;
    min-height:100vh;
    overflow-y:auto;
}

.container{
    display:flex;
    width:100%;
    min-height:100vh;
    gap:14px;
    padding:14px;
}

.sidebar{
    width:320px;
    min-width:320px;
    background:#1e293b;
    border-radius:18px;
    padding:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    overflow:auto;
}

.content{
    flex:1;
    min-width:0;
    background:#1e293b;
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.title{
    font-size:26px;
    font-weight:700;
    margin-bottom:20px;
}

.label{
    display:block;
    margin-bottom:6px;
    margin-top:12px;
    font-size:13px;
    font-weight:600;
}

.input,
input[type="date"],
.select,
.search{
    width:100%;
    background:#334155;
    border:none;
    color:white;
    padding:12px;
    border-radius:12px;
    outline:none;
    font-size:14px;
}

.input:focus,
input[type="date"]:focus,
.select:focus,
.search:focus{
    border:2px solid #4472c4;
}

.buttons{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.btn{
    border:none;
    padding:12px;
    border-radius:14px;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 10px 20px rgba(0,0,0,.20);
}

.btn i{
    font-size:18px;
}

.btn:hover{
    transform:translateY(-2px);
}

.add{background:#22c55e;}
.delete{background:#ef4444;}
.pdf{background:#f59e0b;}
.save{background:#06b6d4;}

.table-container{
    width:100%;
    overflow-x:auto;
    overflow-y:auto;
    border-radius:14px;
    flex:1;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
}

table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

thead{
    background:#4472c4;
    position:sticky;
    top:0;
    z-index:2;
}

th{
    padding:12px;
    text-align:center;
    font-size:13px;
    white-space:nowrap;
}

tbody tr{
    background:#243041;
    transition:.2s;
}

tbody tr:nth-child(even){
    background:#2b3748;
}

tbody tr:hover{
    background:#4472c4;
    cursor:pointer;
}

td{
    padding:10px;
    text-align:center;
    font-size:13px;
}

.footer{
    margin-top:10px;
    color:#c7d2fe;
    font-size:13px;
}

.stats{
    margin-top:5px;
    color:#94a3b8;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:#4472c4;
    border-radius:10px;
}

input[type="date"]::-webkit-calendar-picker-indicator{
    filter:invert(1) brightness(1.6);
    cursor:pointer;
    opacity:1;
    transform:scale(1.2);
}

@media (max-width: 1024px){

    .container{
        flex-direction:column;
        height:auto;
    }

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .content{
        width:100%;
        min-height:auto;
    }
}

@media (max-width: 768px){

    .container{
        padding:10px;
        gap:10px;
    }

    .sidebar,
    .content{
        border-radius:14px;
        padding:14px;
    }

    .btn{
        width:100%;
        font-size:14px;
        padding:13px;
    }

    .btn i{
        font-size:16px;
    }

    .search,
    .input,
    .select,
    input[type="date"]{
        font-size:16px;
    }

    table{
        min-width:700px;
    }

    td,
    th{
        font-size:12px;
        padding:9px;
    }
}

@media (max-width: 480px){

    .container{
        padding:6px;
    }

    .sidebar,
    .content{
        padding:12px;
    }

    .btn{
        font-size:13px;
        border-radius:12px;
    }

    .footer,
    .stats{
        font-size:12px;
    }

    table{
        min-width:650px;
    }
}

</style>
</head>
<body>

<div class="container">

    <div class="sidebar">
<div style="
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    margin-top:8px;
    margin-bottom:40px;
    font-size:23px;
    font-weight:400;
    color:#c7d2fe;
">
    <i class="fa-solid fa-layer-group"></i>
    Registro de Actuaciones
</div>

        <label class="label">Fecha</label>
        <div style="position:relative;">
 <i class="fa-solid fa-calendar-days" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#60a5fa;font-size:22px"></i>
            <input type="date" class="input" id="fecha" style="padding-left:52px;height:42px;font-size:16px;">
        </div>

        <label class="label">Actuación</label>
        <input type="text" class="input" id="actuacion">

        <label class="label">Descripción</label>
        <input type="text" class="input" id="descripcion">

        <label class="label">Aula/Zona</label>
        <input type="text" class="input" id="zona">

        <label class="label">Observaciones</label>
        <input type="text" class="input" id="observaciones">

        <label class="label">Factor</label>
        <div style="position:relative;">

            <select class="select" id="factor" style="appearance:none;-webkit-appearance:none;text-align:center;-moz-appearance:none;padding-right:50px;height:44px;cursor:pointer;">
            <option>1.1: Actividad Extraordinaria</option>
            <option>1.2: Funciones Adicionales</option>
            <option>1.3: Iniciativa y Mejora grupal</option>
            <option>1.4: Especial Atención al Servicio</option>
        </select>
        </div>

        <!--
            -->

        <div class="buttons">
            <button class="btn add" onclick="agregarRegistro()">
                <i class="fa-solid fa-circle-plus"></i>
                Añadir Registro
            </button>

            <button class="btn delete" onclick="eliminarSeleccionado()">
                <i class="fa-regular fa-trash-can"></i>
                Eliminar Registro
            </button>

            <button class="btn pdf" onclick="exportarPDF()">
                <i class="fa-regular fa-file-pdf"></i>
                Exportar Tabla a PDF
            </button>

            <button class="btn save" onclick="guardarDatos(true)">
                <i class="fa-solid fa-cloud-arrow-down"></i>
                Descargar Copia de Seguridad
            </button>
        </div>
    </div>

    <div class="content">

        <input type="text" class="search" placeholder="Buscar registros..." id="busqueda" style="margin-bottom:40px">


        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:90px">Fecha</th>
                        <th style="width:240px">Actuación</th>
                        <th style="width:240px">Factor</th>
                        <th style="width:300px">Descripción</th>
                        <th style="width:100px">Aula/Zona</th>
                        <th style="width:140px">Observaciones</th>
                    </tr>
                </thead>

                <tbody id="tablaBody"></tbody>
            </table>
        </div>

        <div class="footer">
            <div id="contador">
                Total registros: 0
            </div>

            <div class="stats">
                Sistema listo
            </div>
        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<script>
let registros = JSON.parse(localStorage.getItem('registros')) || [];
let filaSeleccionada = null;

renderTabla();

function agregarRegistro(){

    const fecha = document.getElementById('fecha').value;
    const actuacion = document.getElementById('actuacion').value;
    const descripcion = document.getElementById('descripcion').value;
    const zona = document.getElementById('zona').value;
    const observaciones = document.getElementById('observaciones').value;
    const factor = document.getElementById('factor').value;

    if(!actuacion){
        alert('Debes introducir una actuación');
        return;
    }

    registros.push({
        fecha,
        actuacion,
        factor,
        descripcion,
        zona,
        observaciones
    });

    guardarDatos();
    renderTabla();
    limpiarCampos();
}

function renderTabla(){

    const body = document.getElementById('tablaBody');
    body.innerHTML = '';

    registros.forEach((r,index) => {

        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${r.fecha}</td>
            <td>${r.actuacion}</td>
            <td>${r.factor}</td>
            <td>${r.descripcion}</td>
            <td>${r.zona}</td>
            <td>${r.observaciones}</td>
        `;

        tr.onclick = () => seleccionarFila(index,tr);

        body.appendChild(tr);
    });

    document.getElementById('contador').innerText =
        `Total registros: ${registros.length}`;
}

function seleccionarFila(index,tr){

    document.querySelectorAll('tbody tr').forEach(f => {
        f.style.background='';
    });

    tr.style.background='#4472c4';
    filaSeleccionada = index;
}

function eliminarSeleccionado(){

    if(filaSeleccionada === null){
        alert('Selecciona un registro');
        return;
    }

    registros.splice(filaSeleccionada,1);
    filaSeleccionada = null;

    guardarDatos();
    renderTabla();
}

function guardarDatos(descargar = false){

    localStorage.setItem('registros',JSON.stringify(registros));

    if(descargar){

        const datos = JSON.stringify(registros, null, 2);
        const blob = new Blob([datos], { type:'application/json' });

        const enlace = document.createElement('a');
        enlace.href = URL.createObjectURL(blob);
        enlace.download = 'registro.json';

        document.body.appendChild(enlace);
        enlace.click();

        document.body.removeChild(enlace);
        URL.revokeObjectURL(enlace.href);
    }
}

function exportarPDF(){

    if(registros.length === 0){
        alert('No hay registros para exportar');
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');

    const filas = registros.map(r => [
        r.fecha,
        r.actuacion,
        r.factor,
        r.descripcion,
        r.zona,
        r.observaciones
    ]);

    doc.autoTable({
        head:[["Fecha","Actuación","Factor","Descripción","Aula/Zona","Observaciones"]],
        body:filas,
        styles:{
            fontSize:8
        },
        headStyles:{
            fillColor:[68,114,196]
        }
    });

    doc.save('registro_actuaciones.pdf');
}

function limpiarCampos(){
    document.getElementById('actuacion').value = '';
    document.getElementById('descripcion').value = '';
    document.getElementById('zona').value = '';
    document.getElementById('observaciones').value = '';
}

document.getElementById('busqueda').addEventListener('keyup', function(){

    const texto = this.value.toLowerCase();

    document.querySelectorAll('#tablaBody tr').forEach(tr => {

        const contenido = tr.innerText.toLowerCase();

        tr.style.display = contenido.includes(texto)
            ? ''
            : 'none';
    });
});
</script>

</body>
</html>
